function saved() { for (const k of ["session", "local"]) { try { const v = store(k) && store(k).getItem("chs-internal-pw"); if (v) return v; } catch (e) {} } return null; }
async function openPage(pw, remember) {
  const html = await unlock(pw);
  if (html == null) return false;
  try { store("session").setItem("chs-internal-pw", pw); if (remember) store("local").setItem("chs-internal-pw", pw); } catch (e) {}
  document.open(); document.write(html); document.close();
  return true;
}
(async () => {
  const f = document.getElementById("f"), msg = document.getElementById("msg");
  const pw = saved();
  if (pw && await openPage(pw).catch(() => false)) return;
  f.hidden = false;
  f.onsubmit = async e => {
    e.preventDefault(); msg.textContent = "Opening…";
    const ok = await openPage(document.getElementById("pw").value, document.getElementById("rm").checked)
      .catch(err => { msg.textContent = "This browser can't open the page: " + err.message; return null; });
    if (ok === false) { msg.textContent = "That password didn't work."; try { localStorage.removeItem("chs-internal-pw"); } catch (e) {} }
  };
})();
